# Production: built static frontend in nginx, certificates mounted from ./infra/certs
# (tls.crt + tls.key), secrets from .env.prod. The DB port is NOT published.
services:
  postgres:
    environment:
      POSTGRES_DB: ${DB_NAME:-electronic_home}
      POSTGRES_USER: ${DB_USER:?DB_USER is required}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    restart: unless-stopped

  # No port is published: only the backend reaches the storage, through the internal network of the containers.
  s3:
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?S3_ACCESS_KEY is required}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY is required}
    restart: unless-stopped

  backend:
    environment:
      SPRING_PROFILES_ACTIVE: prod
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?S3_ACCESS_KEY is required}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY is required}
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-electronic_home}
      DB_USER: ${DB_USER:?DB_USER is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      # signs the access tokens: at least 32 bytes, kept out of the repository
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      # publishing of receipts is switched off while the token is empty
      RECEIPTS_ADMIN_TOKEN: ${RECEIPTS_ADMIN_TOKEN:-}
      # one-time import of the owners: SPRING_LIQUIBASE_CONTEXTS=prod,owners-import (see README)
      SPRING_LIQUIBASE_CONTEXTS: ${LIQUIBASE_CONTEXTS:-prod}
    volumes:
      # the SQL of the import made by tools/owners-import (personal data, not in git); read only
      - ${OWNERS_IMPORT_DIR:-./data/migrations}:/import:ro
    restart: unless-stopped

  nginx:
    build:
      context: .
      dockerfile: infra/nginx/Dockerfile
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/certs:/etc/nginx/certs:ro
    restart: unless-stopped
