# Development: Vite dev server (HMR) behind nginx, self-signed certificate, DB port open on localhost.
services:
  postgres:
    environment:
      POSTGRES_DB: electronic_home
      POSTGRES_USER: electronic_home
      POSTGRES_PASSWORD: electronic_home
    ports:
      - "127.0.0.1:5435:5432"

  # Keys for development only; the port is open on localhost for the backend that is started from the IDE.
  s3:
    environment:
      S3_ACCESS_KEY: electronic-home-dev
      S3_SECRET_KEY: electronic-home-dev-secret
    ports:
      - "127.0.0.1:8333:8333"

  backend:
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_URL: jdbc:postgresql://postgres:5432/electronic_home
      S3_ACCESS_KEY: electronic-home-dev
      S3_SECRET_KEY: electronic-home-dev-secret

  frontend:
    image: node:22-alpine
    working_dir: /app
    environment:
      BEHIND_NGINX: "true"
    command: sh -c "npm install --no-audit --no-fund && npm run dev"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

  certs-init:
    image: alpine/openssl
    entrypoint: ["sh", "-c"]
    command:
      - |
        [ -f /certs/tls.crt ] || openssl req -x509 -nodes -newkey rsa:2048 -days 365 \
          -subj "/CN=localhost" -addext "subjectAltName=DNS:localhost,IP:127.0.0.1" \
          -keyout /certs/tls.key -out /certs/tls.crt
    volumes:
      - dev_certs:/certs

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      certs-init:
        condition: service_completed_successfully
      backend:
        condition: service_started
      frontend:
        condition: service_started
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/dev.conf:/etc/nginx/conf.d/default.conf:ro
      - dev_certs:/etc/nginx/certs:ro

volumes:
  dev_certs:
  frontend_node_modules:
