# Common settings. The profile (dev | prod) is mandatory: see ProfileGuard.
spring:
  mvc:
    formcontent:
      filter:
        enabled: false
  application:
    name: electronic-home
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

# The lock of a submitted period is on in every profile; switch it off for testing with READINGS_PERIOD_ENFORCED=false.
readings:
  period:
    closing-day: 25
    enforced: true

# Receipts: PDF files on a directory (a volume in Docker), see README. Publishing needs RECEIPTS_ADMIN_TOKEN.
receipts:
  storage:
    path: ${RECEIPTS_STORAGE_PATH:./data/receipts}
  max-size: ${RECEIPTS_MAX_SIZE:5MB}

server:
  port: 8080
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      base-path: /api/actuator
      exposure:
        include: health
