# Common settings. The profile (dev | prod) is mandatory: see ProfileGuard.
spring:
  mvc:
    formcontent:
      filter:
        enabled: false
  application:
    name: electronic-home
  servlet:
    multipart:
      # the files of a message: 10 MB each, 25 MB together (the service checks the real sizes too)
      max-file-size: 10MB
      max-request-size: 26MB
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

# The lock of a submitted period is on in every profile; switch it off for testing with READINGS_PERIOD_ENFORCED=false.
readings:
  period:
    closing-day: 25
    enforced: true

# Receipts: PDF files in the object storage (S3 API), see README. Publishing needs RECEIPTS_ADMIN_TOKEN.
receipts:
  max-size: ${RECEIPTS_MAX_SIZE:5MB}

# The object storage: the receipts and the files attached to the messages of the requests. The address and the keys are
# set by the profile (dev has keys for development, prod has none until S3_ACCESS_KEY and S3_SECRET_KEY are given).
storage:
  s3:
    region: ${S3_REGION:us-east-1}
    receipts-bucket: ${S3_RECEIPTS_BUCKET:electronic-home-receipts}
    attachments-bucket: ${S3_ATTACHMENTS_BUCKET:electronic-home-attachments}
    meter-acts-bucket: ${S3_METER_ACTS_BUCKET:electronic-home-meter-acts}

server:
  port: 8080
  forward-headers-strategy: framework
  tomcat:
    # a rejected upload is read to the end, so that the client gets the answer 413 and not a broken connection
    max-swallow-size: 30MB

management:
  endpoints:
    web:
      base-path: /api/actuator
      exposure:
        include: health
