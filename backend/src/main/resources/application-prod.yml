# No defaults for secrets: a missing DB_URL / DB_USER / DB_PASSWORD fails the startup.
spring:
  liquibase:
    contexts: prod
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

logging:
  level:
    root: INFO

server:
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
    include-exception: false

management:
  endpoint:
    health:
      show-details: never

auth:
  jwt:
    secret: ${JWT_SECRET}

# No defaults for the storage: a missing S3_ENDPOINT / S3_ACCESS_KEY / S3_SECRET_KEY fails the startup.
storage:
  s3:
    endpoint: ${S3_ENDPOINT}
    access-key: ${S3_ACCESS_KEY}
    secret-key: ${S3_SECRET_KEY}

# The old directory of the receipts (mounted read only in Docker): its files are copied into the storage once.
receipts:
  migration:
    source-path: ${RECEIPTS_MIGRATION_SOURCE_PATH:}
