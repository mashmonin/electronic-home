spring:
  liquibase:
    contexts: dev
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5435/electronic_home}
    username: ${DB_USER:electronic_home}
    password: ${DB_PASSWORD:electronic_home}

logging:
  level:
    com.example.electronichome: DEBUG

management:
  endpoint:
    health:
      show-details: always

# Publishing of receipts in development; production has no token until RECEIPTS_ADMIN_TOKEN is set.
receipts:
  admin-token: dev-admin-token

# The storage of docker-compose.dev.yml (port 8333 on localhost); keys for development only.
storage:
  s3:
    endpoint: ${S3_ENDPOINT:http://localhost:8333}
    access-key: ${S3_ACCESS_KEY:electronic-home-dev}
    secret-key: ${S3_SECRET_KEY:electronic-home-dev-secret}

# Only for development: a key from the repository protects nothing in production.
auth:
  jwt:
    secret: dev-only-secret-key-change-me-0123456789
