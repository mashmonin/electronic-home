spring:
  liquibase:
    contexts: dev
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5435/electronic_home}
    username: ${DB_USER:electronic_home}
    password: ${DB_PASSWORD:electronic_home}

logging:
  level:
    com.example.electronichome: DEBUG

management:
  endpoint:
    health:
      show-details: always

# Publishing of receipts in development; production has no token until RECEIPTS_ADMIN_TOKEN is set.
receipts:
  admin-token: dev-admin-token
