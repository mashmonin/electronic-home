databaseChangeLog:
  - changeSet:
      id: 007-create-receipts
      author: electronic-home
      changes:
        - createTable:
            tableName: receipts
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_receipts
              - column:
                  name: account_id
                  type: bigint
                  constraints:
                    nullable: false
                    foreignKeyName: fk_receipts_account
                    references: accounts(id)
              # the first day of the month the receipt is for
              - column:
                  name: period_month
                  type: date
                  constraints:
                    nullable: false
              # the name of the file in the storage (a UUID generated by the server)
              - column:
                  name: file_key
                  type: varchar(36)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uq_receipts_file_key
              - column:
                  name: size_bytes
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: sha256
                  type: varchar(64)
                  constraints:
                    nullable: false
              - column:
                  name: published_at
                  type: timestamptz
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
              - column:
                  name: is_test
                  type: boolean
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            tableName: receipts
            columnNames: account_id, period_month
            constraintName: uq_receipts_account_month
        - sql:
            sql: ALTER TABLE receipts ADD CONSTRAINT ck_receipts_size CHECK (size_bytes > 0)
      rollback:
        - dropTable:
            tableName: receipts
