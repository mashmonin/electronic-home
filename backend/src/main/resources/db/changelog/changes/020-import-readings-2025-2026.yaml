databaseChangeLog:
  - changeSet:
      id: 020-import-readings-2025-2026
      author: electronic-home
      changes:
        # 138 apartments of the house (the address is the test one for now), 418 meters, 6594 readings of 2025 and 2026
        - sqlFile:
            path: db/changelog/changes/020-import-readings-2025-2026.sql
            splitStatements: false
      rollback:
        - sql:
            sql: DELETE FROM meter_readings WHERE NOT is_test AND meter_id IN (SELECT m.id FROM water_meters m JOIN addresses a ON a.id = m.address_id WHERE NOT m.is_test AND a.street = 'ул. Тестовая' AND a.house = 'Дом');
        - sql:
            sql: DELETE FROM water_meters WHERE NOT is_test AND address_id IN (SELECT id FROM addresses WHERE street = 'ул. Тестовая' AND house = 'Дом');
        - sql:
            sql: DELETE FROM addresses a WHERE NOT a.is_test AND a.street = 'ул. Тестовая' AND a.house = 'Дом' AND NOT EXISTS (SELECT 1 FROM water_meters m WHERE m.address_id = a.id);
